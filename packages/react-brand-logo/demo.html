<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compra Viagem - Componente Responsivo R20</title>
<style>
:root{--navy:#171B3A;--blue:#2F6BFF;--coral:#FF5A3D;--sand:#F7F2E9;--white:#fff;--muted:#626779}*{box-sizing:border-box}body{margin:0;background:#ece8e1;color:var(--navy);font-family:Manrope,system-ui,sans-serif}main{max-width:1120px;margin:32px auto;padding:20px}h1{font-size:30px;margin:0 0 6px}p{color:var(--muted)}.controls{display:flex;gap:18px;align-items:end;flex-wrap:wrap;margin:24px 0}.field{display:grid;gap:7px;font-weight:700;font-size:13px}.field input[type=range]{width:240px}.switch{display:flex;align-items:center;gap:8px;min-height:42px}.stage{border-radius:28px;padding:40px;background:var(--sand);transition:.2s}.stage.dark{background:var(--navy)}.header{height:76px;border-radius:18px;background:#fff;display:flex;align-items:center;padding:16px 22px;box-shadow:0 10px 30px #171b3a18}.stage.dark .header{background:#202544}.slot{width:180px;container-type:inline-size;line-height:0}.full,.compact{width:100%}.compact{display:none;max-width:64px}.full img,.compact img{display:block;width:100%;height:auto}@container(max-width:127px){.full{display:none}.compact{display:block}}.meta{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}.stage.dark .meta{color:#cfd7e6}.contexts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.sample{background:#ffffffb8;border-radius:18px;padding:18px}.sample strong{display:block;margin-bottom:10px}.sample small{color:var(--muted)}button{border:0;border-radius:999px;padding:12px 18px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.status{margin-top:18px;font-weight:700;color:var(--blue)}@media(max-width:680px){.contexts{grid-template-columns:1fr}.field input[type=range]{width:180px}}
</style>
</head>
<body><main><h1>Componente responsivo da marca</h1><p>A troca automática acontece abaixo de 128 px. Motion permanece contextual.</p>
<div class="controls"><label class="field">Largura <span><b id="widthValue">180</b> px</span><input id="width" type="range" min="24" max="220" value="180"></label><label class="switch"><input id="theme" type="checkbox"> Fundo escuro</label><label class="switch"><input id="motion" type="checkbox"> Motion permitido</label><button id="replay">Repetir</button></div>
<section id="stage" class="stage"><div class="header"><div id="slot" class="slot"><div class="full"><img id="fullStatic" src="assets/logo-primary.svg" alt="Compra Viagem"><img id="fullMotion" src="assets/logo-motion-light.svg" alt="Compra Viagem" hidden></div><div class="compact"><img id="compactStatic" src="assets/icon-compact-static.svg" alt="Compra Viagem"><img id="compactMotion" src="assets/icon-compact-motion.svg" alt="Compra Viagem" hidden></div></div><div class="meta"><b id="mode">FULL</b><br><span id="asset">wordmark estático</span></div></div>
<div class="contexts"><div class="sample"><strong>Navegação</strong><small>Sempre estática para evitar distração.</small></div><div class="sample"><strong>Institucional</strong><small>R18 disponível quando motion estiver ativo.</small></div><div class="sample"><strong>App compacto</strong><small>R15 animada somente na abertura.</small></div></div><div id="status" class="status" aria-live="polite"></div></section>
</main><script>
const width=document.getElementById('width'),theme=document.getElementById('theme'),motion=document.getElementById('motion'),slot=document.getElementById('slot'),stage=document.getElementById('stage');
function render(replay=false){const w=Number(width.value),dark=theme.checked,animated=motion.checked,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,compact=w<128;document.getElementById('widthValue').textContent=w;slot.style.width=w+'px';stage.classList.toggle('dark',dark);document.getElementById('fullStatic').src=dark?'assets/logo-negative.svg':'assets/logo-primary.svg';const canAnimate=animated&&!reduced;document.getElementById('fullStatic').hidden=canAnimate;document.getElementById('fullMotion').hidden=!canAnimate;document.getElementById('compactStatic').hidden=canAnimate;document.getElementById('compactMotion').hidden=!canAnimate;if(replay&&canAnimate){for(const id of ['fullMotion','compactMotion']){const img=document.getElementById(id),src=img.src;img.src='';requestAnimationFrame(()=>img.src=src)}}document.getElementById('mode').textContent=compact?'COMPACT • R15':'FULL';document.getElementById('asset').textContent=canAnimate?(compact?'R15 animada':'R18 completa'):(compact?'R15 estática':'wordmark estático');document.getElementById('status').textContent=reduced?'Preferência de redução detectada: fallback estático.':(compact?'Abaixo de 128 px: R15.':'A partir de 128 px: assinatura completa.')}[width,theme,motion].forEach(el=>el.addEventListener('input',()=>render(true)));document.getElementById('replay').onclick=()=>render(true);render();
</script></body></html>
