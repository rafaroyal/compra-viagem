<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compra Viagem — Splash</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171B3A}.splash{width:min(92vw,960px)}.splash img{display:block;width:100%;height:auto}@media(prefers-reduced-motion:reduce){.animated{display:none}}@media(prefers-reduced-motion:no-preference){.static{display:none}}

</head>
<body><main class="splash"><img class="animated" src="full/compra-viagem-motion-dark.svg" alt="Compra Viagem"><img class="static" src="../logo/full/compra-viagem-logo-negative.svg" alt="Compra Viagem"></main></body>
</html>
